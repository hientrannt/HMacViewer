name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0. Built from the selected branch; the tag is created if missing."
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RemoteCore

      - name: Build VNC/RDP core
        run: scripts/build_remotecore.sh

      - name: Run tests
        run: swift test --parallel

      - name: Import Developer ID certificate
        id: cert
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "No signing certificate configured; the release will be ad-hoc signed."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/{print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity found in the certificate."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Package universal app
        env:
          MACVIEWER_SIGNING_IDENTITY: "-"
          MACVIEWER_UNIVERSAL: "1"
          MACVIEWER_VERSION: ${{ env.VERSION }}
          MACVIEWER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          scripts/package_app.sh release
          lipo -info dist/HMacViewer.app/Contents/MacOS/MacViewer
          lipo -info dist/HMacViewer.app/Contents/MacOS/macviewer-mcp

      - name: Sign with Developer ID (hardened runtime)
        if: steps.cert.outputs.identity != '-'
        run: |
          codesign --force --options runtime --timestamp \
            --sign "${{ steps.cert.outputs.identity }}" dist/HMacViewer.app/Contents/MacOS/macviewer-mcp
          codesign --force --options runtime --timestamp \
            --sign "${{ steps.cert.outputs.identity }}" dist/HMacViewer.app
          codesign --verify --deep --strict --verbose=2 dist/HMacViewer.app

      - name: Configure notarization credentials
        if: steps.cert.outputs.identity != '-'
        id: notary
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Prefer an App Store Connect API key; fall back to Apple ID + app-specific password.
          if [ -n "$APPSTORE_API_KEY_P8" ] && [ -n "$APPSTORE_API_KEY_ID" ] && [ -n "$APPSTORE_API_ISSUER_ID" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8"
            printf '%s\n' "$APPSTORE_API_KEY_P8" > "$key_path"
            xcrun notarytool store-credentials macviewer-notary --keychain "$RUNNER_TEMP/signing.keychain-db" \
              --key "$key_path" --key-id "$APPSTORE_API_KEY_ID" --issuer "$APPSTORE_API_ISSUER_ID"
            rm -f "$key_path"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials macviewer-notary --keychain "$RUNNER_TEMP/signing.keychain-db" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
          else
            echo "Notarization secrets missing; skipping notarization."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Notarize app
        if: steps.notary.outputs.enabled == 'true'
        run: |
          ditto -c -k --keepParent dist/HMacViewer.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --keychain-profile macviewer-notary --keychain "$RUNNER_TEMP/signing.keychain-db" --wait --timeout 30m
          xcrun stapler staple dist/HMacViewer.app
          echo "NOTARIZED=true" >> "$GITHUB_ENV"

      - name: Build ZIP and DMG
        run: |
          mkdir -p release
          zip_name="HMacViewer-${VERSION}.zip"
          dmg_name="HMacViewer-${VERSION}.dmg"
          ditto -c -k --sequesterRsrc --keepParent dist/HMacViewer.app "release/$zip_name"

          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.5
          PATH="$RUNNER_TEMP/dmgbuild/bin:$PATH" scripts/make_dmg.sh dist/HMacViewer.app "$VERSION" "release/$dmg_name"

          if [ "${{ steps.cert.outputs.identity }}" != "-" ]; then
            codesign --force --timestamp --sign "${{ steps.cert.outputs.identity }}" "release/$dmg_name"
            if [ "${NOTARIZED:-}" = "true" ]; then
              xcrun notarytool submit "release/$dmg_name" \
                --keychain-profile macviewer-notary --keychain "$RUNNER_TEMP/signing.keychain-db" --wait --timeout 30m
              xcrun stapler staple "release/$dmg_name"
            fi
          fi

          # Fixed name so README can link to releases/latest/download/HMacViewer.dmg.
          cp "release/$dmg_name" release/HMacViewer.dmg

          cd release
          shasum -a 256 "$zip_name" "$dmg_name" HMacViewer.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          # Commit subjects since the previous tag. The app's update window shows
          # this "What's new" section and skips "Install".
          previous="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "## What's new"
            git log --no-merges --format='- %s' ${previous:+"$previous.."}HEAD
            echo
            echo "## Install"
            echo "1. Download **HMacViewer.dmg**, open it and drag HMacViewer into Applications."
            echo "2. Requires macOS 12 or later (Apple silicon and Intel)."
            echo "3. Already installed? HMacViewer offers the update itself and restarts when it's done."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: HMacViewer ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/HMacViewer-${{ env.VERSION }}.dmg
            release/HMacViewer-${{ env.VERSION }}.zip
            release/HMacViewer.dmg
            release/SHA256SUMS.txt
          body_path: ${{ runner.temp }}/release-notes.md

      - name: Clean up keychain
        if: always() && steps.cert.outputs.identity != '-'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  linux-release:
    name: Build & publish LinuxViewer
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve version
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libx11-dev libxcb1-dev libasound2-dev libpipewire-0.3-dev libclang-dev clang pkg-config dpkg-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LinuxViewer

      - name: Test
        run: cargo test --locked
        working-directory: LinuxViewer

      - name: Package
        env:
          LINUXVIEWER_VERSION: ${{ env.VERSION }}
        run: scripts/package_linux.sh

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          fail_on_unmatched_files: true
          files: |
            dist/linux/linuxviewer-${{ env.VERSION }}-x86_64.tar.gz
            dist/linux/linuxviewer_${{ env.VERSION }}_amd64.deb
            dist/linux/linuxviewer-x86_64.tar.gz
            dist/linux/linuxviewer-amd64.deb
            dist/linux/linuxviewer-wayland-${{ env.VERSION }}-x86_64.tar.gz
            dist/linux/linuxviewer-wayland_${{ env.VERSION }}_amd64.deb
            dist/linux/linuxviewer-wayland-x86_64.tar.gz
            dist/linux/linuxviewer-wayland-amd64.deb
            dist/linux/SHA256SUMS-linux.txt

  windows-release:
    name: Build & publish Windows app
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve version
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - name: MinGW toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
          rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LinuxViewer

      # Viewer only: hosting needs X11/Wayland. Not code-signed, so Windows
      # SmartScreen asks once ("More info" -> "Run anyway").
      - name: Build
        working-directory: LinuxViewer
        run: cargo build --release --locked --target x86_64-pc-windows-gnu --no-default-features --features desktop

      - name: Package
        run: |
          mkdir -p release/HMacViewer
          cp LinuxViewer/target/x86_64-pc-windows-gnu/release/linuxviewer.exe release/HMacViewer/HMacViewer.exe
          cp LICENSE release/HMacViewer/LICENSE.txt
          cd release
          zip -qr "HMacViewer-Windows-${VERSION}.zip" HMacViewer
          cp HMacViewer/HMacViewer.exe "HMacViewer-Windows-${VERSION}.exe"
          ls -l

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          fail_on_unmatched_files: true
          files: |
            release/HMacViewer-Windows-${{ env.VERSION }}.zip
            release/HMacViewer-Windows-${{ env.VERSION }}.exe

  android-release:
    name: Build & publish Android app
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve version
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: AndroidViewer/native

      - name: Build native library
        working-directory: AndroidViewer/native
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release --locked

      - name: Build signed APK
        working-directory: AndroidViewer
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HMACVIEWER_VERSION: ${{ env.VERSION }}
          HMACVIEWER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set; the APK is signed with a throwaway debug key."
          fi
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/HMacViewer-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk ../release/HMacViewer.apk
          cd ../release && sha256sum HMacViewer-${VERSION}.apk HMacViewer.apk > SHA256SUMS-android.txt

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ env.PRERELEASE }}
          fail_on_unmatched_files: true
          files: |
            release/HMacViewer-${{ env.VERSION }}.apk
            release/HMacViewer.apk
            release/SHA256SUMS-android.txt

  ios-release:
    name: Build iPhone/iPad app
    needs: release
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MARKETING=${version%%-*}" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RemoteCore

      - name: Build VNC/RDP core
        run: scripts/build_remotecore.sh

      - name: Generate Xcode project
        working-directory: iOSViewer
        run: |
          brew install xcodegen
          xcodegen generate

      # Unsigned build for sideloading (Sideloadly/AltStore re-sign it with
      # the user's Apple ID). Always attached to the release.
      - name: Build unsigned IPA
        working-directory: iOSViewer
        run: |
          set -o pipefail
          xcodebuild -project HMacViewer.xcodeproj -scheme HMacViewer -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/unsigned.xcarchive" \
            MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive 2>&1 \
            | grep -E "error:|BUILD|ARCHIVE" | grep -v "^ld: warning" | tail -40
          mkdir -p "$RUNNER_TEMP/ipa/Payload" ../release
          cp -R "$RUNNER_TEMP/unsigned.xcarchive/Products/Applications/HMacViewer.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/release/HMacViewer-iOS-${VERSION}-unsigned.ipa" Payload)
          ls -l ../release

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          fail_on_unmatched_files: true
          files: release/HMacViewer-iOS-${{ env.VERSION }}-unsigned.ipa

      # Signed builds. Xcode creates and manages the distribution certificate
      # and profiles through the App Store Connect API key (role Admin or App
      # Manager). None of these steps can fail the release.
      - name: Prepare iOS signing
        id: sign
        continue-on-error: true
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPSTORE_API_KEY_P8" ] || [ -z "$APPSTORE_API_KEY_ID" ] || [ -z "$APPSTORE_API_ISSUER_ID" ]; then
            echo "::warning::No App Store Connect API key; only the unsigned IPA is published."
            exit 0
          fi
          team="$APPLE_TEAM_ID"
          if [ -z "$team" ] && [ -n "$MACOS_CERTIFICATE_P12" ]; then
            # The Developer ID certificate's OU is the team ID.
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            for legacy in -legacy ""; do
              team="$(openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys -passin env:MACOS_CERTIFICATE_PASSWORD $legacy 2>/dev/null \
                | openssl x509 -noout -subject -nameopt multiline 2>/dev/null \
                | awk -F' = ' '/organizationalUnitName/{print $2; exit}' || true)"
              [ -n "$team" ] && break
            done
            rm -f "$RUNNER_TEMP/cert.p12"
          fi
          if [ -z "$team" ]; then
            echo "::warning::Team ID unknown (add the APPLE_TEAM_ID secret); only the unsigned IPA is published."
            exit 0
          fi
          printf '%s\n' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "team=$team" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Archive signed iOS app
        id: archive
        if: steps.sign.outputs.enabled == 'true'
        continue-on-error: true
        working-directory: iOSViewer
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project HMacViewer.xcodeproj -scheme HMacViewer -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/HMacViewer.xcarchive" \
            DEVELOPMENT_TEAM="${{ steps.sign.outputs.team }}" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" \
            archive 2>&1 | grep -E "error:|BUILD|ARCHIVE" | tail -40

      # Ad Hoc: installs straight onto the iPhones registered under Devices
      # in the developer account (up to 100 a year), no App Store or TestFlight.
      - name: Export Ad Hoc IPA
        id: adhoc
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/adhoc.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>${{ steps.sign.outputs.team }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>compileBitcode</key><false/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HMacViewer.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/adhoc.plist" -exportPath "$RUNNER_TEMP/adhoc" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" 2>&1 | tail -30
          ipa="$(ls "$RUNNER_TEMP"/adhoc/*.ipa | head -1)"
          cp "$ipa" "release/HMacViewer-iOS-${VERSION}.ipa"
          ls -l release

      # Optional: with a DIAWI_TOKEN secret (diawi.com, free), the Ad Hoc IPA
      # also gets an install link and QR code to open on the iPhone.
      - name: Install link (Diawi)
        if: steps.adhoc.outcome == 'success'
        continue-on-error: true
        env:
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}
        run: |
          if [ -z "$DIAWI_TOKEN" ]; then
            echo "No DIAWI_TOKEN secret; install the IPA from the release page with Finder or Apple Configurator."
            exit 0
          fi
          job="$(curl -fsS https://upload.diawi.com/ -F token="$DIAWI_TOKEN" \
            -F file=@"release/HMacViewer-iOS-${VERSION}.ipa" -F find_by_udid=0 -F wall_of_apps=0 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["job"])')"
          for _ in $(seq 1 30); do
            sleep 5
            status="$(curl -fsS "https://upload.diawi.com/status?token=$DIAWI_TOKEN&job=$job")"
            link="$(printf '%s' "$status" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("link","") if d.get("status")==2000 else "")')"
            [ -n "$link" ] && break
          done
          if [ -z "$link" ]; then echo "::warning::Diawi did not finish: $status"; exit 0; fi
          echo "::notice title=iPhone install link::$link"
          echo "IPHONE_LINK=$link" >> "$GITHUB_ENV"

      - name: Publish Ad Hoc IPA
        if: steps.adhoc.outcome == 'success'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          files: release/HMacViewer-iOS-${{ env.VERSION }}.ipa

      - name: Add the install link to the release notes
        if: env.IPHONE_LINK != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          append_body: true
          body: |

            **iPhone install link (Ad Hoc):** ${{ env.IPHONE_LINK }}

      # TestFlight needs an app record for io.github.hientrannt.hmacviewer in
      # App Store Connect.
      - name: Upload to TestFlight
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ steps.sign.outputs.team }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HMacViewer.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" 2>&1 | tail -30
          echo "Uploaded build ${{ github.run_number }}; it appears in TestFlight after Apple processes it."

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test & build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-${{ runner.os }}-

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RemoteCore

      - name: Build VNC/RDP core
        run: scripts/build_remotecore.sh

      - name: Run tests
        run: swift test --parallel

      - name: Package app
        env:
          MACVIEWER_SIGNING_IDENTITY: "-"
          MACVIEWER_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package_app.sh release

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent dist/HMacViewer.app dist/HMacViewer.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HMacViewer-${{ github.sha }}
          path: dist/HMacViewer.zip
          retention-days: 14

  # Experimental macOS 11 build; it doesn't fail CI while Big Sur support is
  # unproven. Xcode 27 can't target below 12, so it uses Xcode 16.
  build-macos11:
    name: Build for macOS 11 (experimental)
    runs-on: macos-15
    timeout-minutes: 45
    continue-on-error: true
    env:
      MACVIEWER_MIN_MACOS: "11"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      # No VNC/RDP core here: Xcode 16's linker rejects the prelinked
      # RemoteCoreKit module ("null objc class data"), so this experimental
      # build has VNC/RDP turned off. Release builds use the current Xcode.

      - name: Package app
        env:
          MACVIEWER_SIGNING_IDENTITY: "-"
          MACVIEWER_UNIVERSAL: "1"
          MACVIEWER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          scripts/package_app.sh release
          vtool -show-build dist/HMacViewer.app/Contents/MacOS/MacViewer | grep -E "minos|platform"
          otool -L dist/HMacViewer.app/Contents/MacOS/MacViewer | grep -i swift_Concurrency
          otool -l dist/HMacViewer.app/Contents/MacOS/MacViewer | grep -A2 LC_RPATH | grep path

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent dist/HMacViewer.app dist/HMacViewer-macOS11.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HMacViewer-macOS11-${{ github.sha }}
          path: dist/HMacViewer-macOS11.zip
          retention-days: 14

  linux:
    name: LinuxViewer (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: LinuxViewer
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libx11-dev libxcb1-dev libasound2-dev libpipewire-0.3-dev libclang-dev clang pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LinuxViewer

      - name: Run tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: linuxviewer-${{ github.sha }}
          path: LinuxViewer/target/release/linuxviewer
          retention-days: 14

  remotecore:
    name: RemoteCore (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: RemoteCore
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RemoteCore

      - name: Run tests
        run: cargo test --locked

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: AndroidViewer/native

      - name: Build native library
        working-directory: AndroidViewer/native
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release --locked

      - name: Build APK
        working-directory: AndroidViewer
        env:
          HMACVIEWER_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: HMacViewer-android-${{ github.sha }}
          path: AndroidViewer/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  ios:
    name: iOS app
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RemoteCore

      - name: Build VNC/RDP core
        run: scripts/build_remotecore.sh

      - name: Generate Xcode project
        working-directory: iOSViewer
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iOS Simulator
        working-directory: iOSViewer
        run: |
          set -o pipefail
          xcodebuild -project HMacViewer.xcodeproj -scheme HMacViewer \
            -destination "generic/platform=iOS Simulator" -configuration Release \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" | grep -v "^ld: warning" | tail -60

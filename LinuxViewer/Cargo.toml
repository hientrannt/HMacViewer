[package]
name = "linuxviewer"
version = "0.1.0"
edition = "2021"
description = "UltraViewer-compatible remote desktop client and host for Linux (Rust port of MacViewer)"
license = "MIT"

[lib]
name = "linuxviewer"
path = "src/lib.rs"

[[bin]]
name = "linuxviewer"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["wayland"]
# Windows, audio playback, clipboard and hosting. Without it the crate is the
# protocol core only (the Android viewer builds it that way).
desktop = ["dep:cpal", "dep:font8x8", "dep:rpassword", "dep:softbuffer", "dep:winit", "dep:ctrlc", "dep:arboard",
           "dep:x11rb", "dep:libc"]
# Wayland hosting through xdg-desktop-portal + PipeWire (Linux only).
wayland = ["desktop", "dep:ashpd", "dep:pipewire", "dep:tokio"]

[dependencies]
base64 = "0.22"
cpal = { version = "0.15", optional = true }
font8x8 = { version = "0.3", optional = true }
cbc = { version = "0.1", features = ["alloc"] }
des = "0.8"
aes = "0.8"
getrandom = "0.3"
jpeg-decoder = { version = "0.3", default-features = false }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
rpassword = { version = "7", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
softbuffer = { version = "0.4", optional = true }
winit = { version = "0.30", optional = true }
zstd-safe = { version = "7", features = ["experimental", "std"] }
png = "0.17"
ctrlc = { version = "3", optional = true }
unicode-normalization = "0.1"
arboard = { version = "3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "randr", "shm"], optional = true }
libc = { version = "0.2", optional = true }
ashpd = { version = "0.13", optional = true, default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
pipewire = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "sync", "time"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"], optional = true }

[profile.release]
lto = "thin"

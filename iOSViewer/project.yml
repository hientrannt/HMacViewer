name: HMacViewer
options:
  bundleIdPrefix: io.github.hientrannt
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
packages:
  HMacViewerCore:
    path: ..
targets:
  HMacViewer:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - Sources
      - Resources
    dependencies:
      - package: HMacViewerCore
        product: UltraViewerProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hientrannt.hmacviewer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HMacViewer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "HMacViewer connects directly to a computer on the same network for a faster session."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic

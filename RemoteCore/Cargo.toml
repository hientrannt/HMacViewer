[package]
name = "remotecore"
version = "0.1.0"
edition = "2021"
description = "VNC and RDP viewer sessions shared by the HMacViewer apps"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
jpeg-decoder = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
vnc-rs = "0.6"
ironrdp-client = "0.1"
ironrdp-tls = { version = "0.2", default-features = false, features = ["rustls-ring"] }
# ironrdp-client needs a TLS websocket backend; this one adds no extra crypto library.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-webpki-roots"] }
ironrdp-pdu = "0.9"
smallvec = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
png = "0.17"
